<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>المبادرات حسب الدوائر</title>
<meta name="theme-color" content="#0b3a5d">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b3a5d;--navy-2:#124c78;--teal:#1597a5;--teal-soft:#e3f4f6;--bg:#f3f6f9;--card:#fff;--ink:#1b2733;--muted:#64748b;--line:#dbe3ea;--danger:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
header{background:#fff;border-bottom:4px solid var(--teal);text-align:center;padding:12px 16px 6px}
header img{max-width:260px;width:70%;height:auto}
.band{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:16px;text-align:center}
.band h1{margin:0;font-size:1.25rem;font-weight:800}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--teal-soft);border-radius:12px;padding:10px;text-align:center}
.stat .n{font-size:1.6rem;font-weight:800;color:var(--navy);line-height:1.1}
.stat .l{font-size:.8rem;color:var(--muted)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.filters .full{grid-column:1/-1}
select,input[type=search]{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);outline:none}
select:focus,input:focus{border-color:var(--teal)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:.88rem;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:6px 12px;cursor:pointer}
.dept{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dept-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.dept-h .t{flex:1;font-weight:800;color:var(--navy)}
.badge{background:var(--navy);color:#fff;border-radius:999px;font-size:.8rem;font-weight:700;padding:1px 10px}
.arrow{color:var(--muted);transition:transform .15s}
.dept.closed .arrow{transform:rotate(90deg)}
.dept.closed .items{display:none}
.dept.empty .dept-h{opacity:.55;cursor:default}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex:none;margin:0}
.item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border-bottom:0}
.item label{flex:1;cursor:pointer;min-width:0}
.item .tt{font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:.76rem;border-radius:6px;padding:1px 8px;background:var(--teal-soft);color:var(--navy)}
.tag.nat{background:#fff3dc;color:#8a5a00}
.det{font-size:.88rem;color:#334155;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.by{font-size:.78rem;color:var(--muted);margin-top:4px}
.bar{position:fixed;inset:auto 0 0 0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.sel{font-size:.88rem;color:var(--muted);white-space:nowrap}
.xl{flex:1;font:inherit;font-weight:800;font-size:1rem;padding:13px;border:0;border-radius:12px;background:var(--teal);color:#fff;cursor:pointer}
.xl:disabled{opacity:.5}
.msg{padding:12px;border-radius:10px;background:#fdecea;color:var(--danger);margin-top:14px}
.muted{color:var(--muted);text-align:center;padding:20px}
.del{font:inherit;font-size:.8rem;font-weight:700;border:0;background:#fdecea;color:var(--danger);border-radius:8px;padding:6px 10px;cursor:pointer;flex:none}
.del:disabled{opacity:.5}
.ref{font:inherit;font-size:.85rem;border:0;background:none;color:var(--navy);cursor:pointer;text-decoration:underline}
@media(max-width:480px){.stat .n{font-size:1.35rem}}
</style>
</head>
<body>
<header><img src="logo.png" alt="وزارة الصحة"></header>
<div class="band"><h1>المبادرات حسب الدوائر</h1></div>

<main class="wrap">
  <section class="card">
    <div class="stats">
      <div class="stat"><div class="n" id="sTotal">—</div><div class="l">مبادرة</div></div>
      <div class="stat"><div class="n" id="sDepts">—</div><div class="l">دائرة شاركت</div></div>
      <div class="stat"><div class="n" id="sNat">—</div><div class="l">مبادرة وطنية</div></div>
    </div>
    <div class="filters">
      <select id="fDept"><option value="">كل الدوائر</option></select>
      <select id="fScope"><option value="">كل النطاقات</option><option>داخل المحافظة</option><option>وطنية</option></select>
      <select id="fDir" class="full"><option value="">كل الاتجاهات الاستراتيجية</option></select>
      <input type="search" id="fText" class="full" placeholder="بحث في العنوان أو التفاصيل أو الاسم...">
    </div>
    <div class="tools">
      <button class="chip" id="allBtn">تحديد الكل</button>
      <button class="chip" id="noneBtn">إلغاء التحديد</button>
      <button class="chip" id="foldBtn">طيّ / فتح الدوائر</button>
      <button class="ref" id="refBtn">↻ تحديث البيانات</button>
    </div>
  </section>

  <div id="list"><p class="muted">جارٍ تحميل المبادرات...</p></div>
</main>

<div class="bar">
  <div class="bar-in">
    <span class="sel" id="selCount">٠ محددة</span>
    <button class="xl" id="xlBtn" disabled>⬇ تصدير المحدد إلى Excel</button>
  </div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyDTdZ5ya_XP_0wyJoR_LGC8frL8f3eG22o",
  authDomain: "mobadarat-e33ac.firebaseapp.com",
  projectId: "mobadarat-e33ac",
  storageBucket: "mobadarat-e33ac.firebasestorage.app",
  messagingSenderId: "81815678002",
  appId: "1:81815678002:web:f303acea4b21dd4cfca02b"
};
const COLL = 'initiatives';
const DEPARTMENTS = [
  'دائرة مراقبة الأمراض والوقاية منها','دائرة الخدمات الصحية والبرامج','دائرة صحة المرأة والطفل',
  'التجمع الصحي الأول','التجمع الصحي الثاني','التجمع الصحي الثالث','مستشفى إبراء','مستشفى سناو',
  'دائرة التخطيط والتنظيم الصحي','دائرة تقنية المعلومات','دائرة الموارد البشرية',
  'دائرة الشؤون المالية','دائرة الخدمات المساندة'
];
const DIRECTIONS = [
  'تعزيز الصحة العامة والوقائية للمجتمع','تحسين تجربة المريض','تجويد الخدمات',
  'رفع كفاءة وكفاية الموارد البشرية','تعزيز وتحقيق التوسعة الشاملة للخدمات الصحية'
];
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso => { const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('en-GB', { timeZone: 'Asia/Muscat', hour12: false }).replace(',', '').slice(0, 16); };

let fs, rows = [];
const selected = new Set();

DEPARTMENTS.forEach(d => $('#fDept').add(new Option(d, d)));
DIRECTIONS.forEach((d, i) => $('#fDir').add(new Option(AR(i + 1) + '. ' + d, d)));

async function load() {
  $('#refBtn').textContent = 'جارٍ التحديث...';
  try {
    if (!fs) {
      const [{ initializeApp }, m] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-firestore.js')]);
      fs = { ...m, db: m.getFirestore(initializeApp(firebaseConfig)) };
    }
    const snap = await fs.getDocs(fs.collection(fs.db, COLL));
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.clientTime || '').localeCompare(b.clientTime || '') || (a.order || 0) - (b.order || 0));
    const ids = new Set(rows.map(r => r.id));
    [...selected].forEach(id => ids.has(id) || selected.delete(id));
    stats(); render();
  } catch (e) {
    $('#list').innerHTML = '<div class="msg">تعذّر تحميل البيانات (' + esc(e.code || e.message) +
      '). تأكد من الاتصال بالإنترنت ومن نشر قواعد Firestore.</div>';
  }
  $('#refBtn').textContent = '↻ تحديث البيانات';
}

function stats() {
  $('#sTotal').textContent = AR(rows.length);
  $('#sDepts').textContent = AR(new Set(rows.map(r => r.department)).size) + ' / ' + AR(DEPARTMENTS.length);
  $('#sNat').textContent = AR(rows.filter(r => r.scope === 'وطنية').length);
}

function filtered() {
  const d = $('#fDept').value, s = $('#fScope').value, dir = $('#fDir').value, q = $('#fText').value.trim();
  return rows.filter(r => (!d || r.department === d) && (!s || r.scope === s) && (!dir || r.direction === dir) &&
    (!q || [r.title, r.details, r.name].some(x => (x || '').includes(q))));
}

function render() {
  const vis = filtered();
  const depts = [...DEPARTMENTS, ...new Set(rows.map(r => r.department).filter(d => !DEPARTMENTS.includes(d)))];
  const onlyDept = $('#fDept').value;
  const filtering = onlyDept || $('#fScope').value || $('#fDir').value || $('#fText').value.trim();
  $('#list').innerHTML = depts.filter(d => !onlyDept || d === onlyDept).map(d => {
    const items = vis.filter(r => r.department === d);
    if (!items.length && filtering) return '';
    const all = items.length && items.every(r => selected.has(r.id));
    return `<section class="dept ${items.length ? '' : 'empty closed'}" data-d="${esc(d)}">
      <div class="dept-h">
        <input type="checkbox" class="dchk" ${all ? 'checked' : ''} ${items.length ? '' : 'disabled'} aria-label="تحديد مبادرات الدائرة">
        <span class="t">${esc(d)}</span><span class="badge">${AR(items.length)}</span><span class="arrow">▾</span>
      </div>
      <div class="items">${items.map(r => `
        <div class="item">
          <input type="checkbox" class="ichk" id="c_${r.id}" data-id="${r.id}" ${selected.has(r.id) ? 'checked' : ''}>
          <label for="c_${r.id}">
            <div class="tt">${esc(r.title)}</div>
            <div class="meta"><span class="tag">${esc(r.direction)}</span><span class="tag ${r.scope === 'وطنية' ? 'nat' : ''}">${esc(r.scope)}</span></div>
            ${r.details ? `<div class="det">${esc(r.details)}</div>` : ''}
            <div class="by">${esc(r.name)} · ${fmt(r.clientTime)}</div>
          </label>
          <button class="del" data-del="${r.id}" aria-label="حذف المبادرة">حذف</button>
        </div>`).join('')}</div>
    </section>`;
  }).join('') || '<p class="muted">لا توجد مبادرات مطابقة.</p>';
  updateBar();
}

function updateBar() {
  $('#selCount').textContent = AR(selected.size) + ' محددة';
  $('#xlBtn').disabled = selected.size === 0;
}

$('#list').addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('ichk')) {
    t.checked ? selected.add(t.dataset.id) : selected.delete(t.dataset.id);
    const sec = t.closest('.dept'), boxes = [...sec.querySelectorAll('.ichk')];
    sec.querySelector('.dchk').checked = boxes.every(b => b.checked);
  } else if (t.classList.contains('dchk')) {
    t.closest('.dept').querySelectorAll('.ichk').forEach(b => {
      b.checked = t.checked; t.checked ? selected.add(b.dataset.id) : selected.delete(b.dataset.id);
    });
  }
  updateBar();
});
$('#list').addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const r = rows.find(x => x.id === del.dataset.del);
    if (!r || !confirm('حذف المبادرة نهائياً؟\n\n«' + r.title + '»\n' + r.department + '\n\nلا يمكن التراجع عن الحذف.')) return;
    del.disabled = true; del.textContent = '...';
    try {
      await fs.deleteDoc(fs.doc(fs.db, COLL, r.id));
      rows = rows.filter(x => x.id !== r.id); selected.delete(r.id);
      stats(); render();
    } catch (err) {
      alert('تعذّر الحذف (' + (err.code || err.message) + '). تأكد من نشر قواعد Firestore الجديدة.');
      del.disabled = false; del.textContent = 'حذف';
    }
    return;
  }
  const h = e.target.closest('.dept-h');
  if (h && !e.target.classList.contains('dchk') && !h.parentNode.classList.contains('empty')) h.parentNode.classList.toggle('closed');
});
$('#allBtn').onclick = () => { filtered().forEach(r => selected.add(r.id)); render(); };
$('#noneBtn').onclick = () => { selected.clear(); render(); };
$('#foldBtn').onclick = () => {
  const secs = [...document.querySelectorAll('.dept:not(.empty)')];
  const close = secs.some(s => !s.classList.contains('closed'));
  secs.forEach(s => s.classList.toggle('closed', close));
};
$('#refBtn').onclick = load;
['#fDept', '#fScope', '#fDir'].forEach(s => $(s).onchange = render);
$('#fText').oninput = render;

$('#xlBtn').onclick = async () => {
  const b = $('#xlBtn'); b.disabled = true; b.textContent = 'جارٍ التجهيز...';
  try {
    if (!window.XLSX) await new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = ok; s.onerror = no; document.head.appendChild(s);
    });
    const order = d => { const i = DEPARTMENTS.indexOf(d); return i < 0 ? 99 : i; };
    const pick = rows.filter(r => selected.has(r.id))
      .sort((a, b) => order(a.department) - order(b.department) || (a.clientTime || '').localeCompare(b.clientTime || ''));
    const aoa = [['م', 'الدائرة', 'الاتجاه الاستراتيجي', 'عنوان المبادرة', 'نطاق المبادرة', 'تفاصيل المبادرة', 'اسم المُعبّئ', 'تاريخ الإرسال']];
    pick.forEach((r, i) => aoa.push([i + 1, r.department, r.direction, r.title, r.scope, r.details, r.name, fmt(r.clientTime)]));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [5, 28, 34, 40, 14, 60, 22, 16].map(w => ({ wch: w }));
    ws['!autofilter'] = { ref: 'A1:H' + aoa.length };
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    XLSX.utils.book_append_sheet(wb, ws, 'المبادرات');
    XLSX.writeFile(wb, 'مبادرات_الدوائر_' + new Date().toISOString().slice(0, 10) + '.xlsx');
  } catch (e) { alert('تعذّر إنشاء ملف Excel.'); }
  b.textContent = '⬇ تصدير المحدد إلى Excel'; updateBar();
};

load();
</script>
</body>
</html>
